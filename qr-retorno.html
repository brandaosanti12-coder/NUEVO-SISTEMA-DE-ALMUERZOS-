<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Retorno</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f3f4f6; margin: 0; }
  .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); text-align: center; }
  .logo { max-width: 140px; height: auto; margin: 0 auto 15px auto; display: block; }
  h2 { color: #10b981; margin-top: 0; font-size: 26px; }
  p { color: #6b7280; margin-bottom: 25px; }
  canvas { border: 4px solid #f3f4f6; border-radius: 12px; padding: 10px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>
<body>
<div class="card">
  <img src="logo_itsanet.png" alt="Logo ITSANET" class="logo">
  <h2>Registro de Retorno</h2>
  <p>Escanea este código al regresar de almorzar</p>
  <canvas id="qr"></canvas>
</div>
<script>
  const hoy = new Date().toLocaleDateString('sv-SE');
  const url = "https://brandaosanti12-coder.github.io/NUEVO-SISTEMA-DE-ALMUERZOS-/retorno.html?token=" + hoy + "&tipo=retorno";
  QRCode.toCanvas(document.getElementById("qr"), url, { width: 250, color: { dark: '#059669', light: '#ffffff' } });
</script>
</body>
</html>
