<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - Retorno Almuerzo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root { --primary: #10b981; --primary-hover: #059669; --bg-grad-1: #d1fae5; --bg-grad-2: #ecfdf5; --card-bg: #ffffff; --text-main: #1f2937; --text-muted: #6b7280; --border: #d1d5db; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2)); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .box { background: var(--card-bg); padding: 40px 32px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); text-align: center; }
  .logo { max-width: 140px; height: auto; margin: 0 auto 15px auto; display: block; }
  .box h2 { font-size: 24px; font-weight: 700; color: var(--primary); margin-bottom: 25px; }
  .form-group { margin-bottom: 20px; text-align: left; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
  select { font-family: inherit; font-size: 15px; padding: 14px 16px; width: 100%; border: 1px solid var(--border); border-radius: 12px; background-color: #f9fafb; appearance: none; cursor: pointer; transition: 0.2s; }
  select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15); background: white; }
  button { font-family: inherit; font-size: 16px; font-weight: 600; padding: 14px; width: 100%; margin-top: 10px; background-color: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; }
  button:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
  .status-area { margin-top: 25px; padding-top: 20px; border-top: 1px solid #e5e7eb; font-size: 18px; }
  .verde { color: var(--primary); font-weight: 700; }
  .rojo { color: #ef4444; font-weight: 700; animation: pulse 2s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
</style>
</head>
<body>

<div class="box" id="contenedorPrincipal">
  <img src="logo_itsanet.png" alt="Logo ITSANET" class="logo">
  
  <h2>Retorno Almuerzo</h2>
  <div class="form-group">
    <label>Área de trabajo</label>
    <select id="area" onchange="cargarEmpleados()">
      <option value="">-- Seleccionar --</option>
      <option value="PLAYA">PLAYA</option>
      <option value="FACTURACION">FACTURACIÓN</option>
      <option value="OFICINA">OFICINA</option>
    </select>
  </div>
  <div class="form-group">
    <label>Nombre del empleado</label>
    <select id="nombre" onchange="verEstado()">
      <option value="">-- Seleccionar --</option>
    </select>
  </div>
  <button id="retornoBtn" onclick="registrarRetorno()">Registrar Retorno</button>
  <div class="status-area" id="resultado"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const params = new URLSearchParams(window.location.search);
const token = params.get("token"); const tipo = params.get("tipo"); const hoy = new Date().toLocaleDateString('sv-SE');

if (token !== hoy || tipo !== "retorno") {
  document.getElementById("contenedorPrincipal").innerHTML = `
    <img src="logo_itsanet.png" alt="Logo ITSANET" class="logo">
    <h2 style="color:red">Acceso Denegado</h2>
    <p>QR incorrecto o de un día anterior.</p>`; 
  throw new Error();
}

const llaveMemoria = "tiempo_retorno_" + hoy;
let tiempoApertura = sessionStorage.getItem(llaveMemoria);
if (!tiempoApertura) { tiempoApertura = Date.now(); sessionStorage.setItem(llaveMemoria, tiempoApertura); }

window.reiniciarSistema = function() { sessionStorage.removeItem(llaveMemoria); location.reload(); };

const app = initializeApp({ apiKey:"AIzaSyCyzE_spj6e0VASt5FP50_5m2Ya-GJloM4", authDomain:"registro-bionetrico.firebaseapp.com", projectId:"registro-bionetrico" });
const db = getFirestore(app);

// Variables para empleados dinámicos
let empleadosDb = {};

window.cargarEmpleados = async function(){
  const area = document.getElementById("area").value; 
  const select = document.getElementById("nombre"); 
  
  if (Object.keys(empleadosDb).length === 0) {
      select.innerHTML = '<option value="">-- Cargando personal... --</option>';
      const ref = doc(db, "configuracion", "empleados");
      const snap = await getDoc(ref);
      if (snap.exists()) empleadosDb = snap.data();
  }

  select.innerHTML = '<option value="">-- Seleccionar --</option>';
  empleadosDb[area]?.forEach(n => { let o = document.createElement("option"); o.value = n; o.textContent = n; select.appendChild(o); });
  document.getElementById("resultado").innerHTML = "";
};

window.verEstado = async function(){
  const nombre=document.getElementById("nombre").value; const ref=doc(db,"registros",nombre+"_"+hoy); const snap=await getDoc(ref);
  if(!snap.exists()) return; const d=snap.data(); 
  if(d.salida){ window.salidaGlobal=d.salida.seconds*1000; }
  if(d.regreso) { document.getElementById("retornoBtn").disabled = true; } 
};

window.registrarRetorno = async function(){
  if (Date.now() - parseInt(tiempoApertura) > 120000) {
    document.getElementById("contenedorPrincipal").innerHTML = `
      <img src="logo_itsanet.png" alt="Logo ITSANET" class="logo">
      <h2 style="color: #ef4444; margin:0; font-size: 28px;">¡TIEMPO AGOTADO! ⏳</h2>
      <p style="color: #4b5563; margin-top: 15px; font-size: 15px;">Pasaron más de 2 minutos desde que escaneaste el código. Por seguridad, la marcación ha sido bloqueada.</p>
      <div style="background-color: #fef2f2; border: 2px solid #ef4444; border-radius: 12px; padding: 20px; margin-top: 20px;">
        <p style="color: #b91c1c; font-weight: 800; font-size: 16px; margin: 0;">⚠️ PASO OBLIGATORIO:</p>
        <p style="color: #991b1b; font-weight: 600; font-size: 15px; margin-top: 12px; text-align: left;">1️⃣ CIERRA ESTA PESTAÑA por completo.<br><br>2️⃣ VUELVE A ESCANEAR el código QR físico.</p>
      </div>`;
    return;
  }

  const nombre=document.getElementById("nombre").value; if(!nombre) return alert("Selecciona un nombre");
  const ref=doc(db,"registros",nombre+"_"+hoy);
  
  await updateDoc(ref,{regreso:serverTimestamp()});
  sessionStorage.removeItem(llaveMemoria); 

  const snap=await getDoc(ref); const d=snap.data(); const usado = ((d.regreso.seconds*1000) - (d.salida.seconds*1000))/60000;

  if(usado>60){ document.getElementById("resultado").innerHTML=`<span class="rojo">Tiempo excedido: ${Math.floor(usado-60)} min extra</span>`; } 
  else { document.getElementById("resultado").innerHTML=`<span class="verde">Llegada a tiempo (Usado: ${Math.floor(usado)} min)</span>`; }
  
  document.getElementById("retornoBtn").disabled = true;
};
</script>
</body>
</html>
